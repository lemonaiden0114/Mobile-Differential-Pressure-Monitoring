<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음압병실 차압 모니터링 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: rgb(28, 28, 34); /* BIM 뷰어 메인 배경색 */
      color: #e8ebf0;
      user-select: none;
      overflow: hidden; /* 상하/좌우 스크롤바 완전 제거 (100vh 고정) */
      touch-action: manipulation;
    }

    /* BIM 뷰어 스타일 프레임 및 컨테이너 */
    .cad-frame {
      border: 1px solid #2f3744;
      background-color: #171b22;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    /* 모바일 2단계 뷰 슬라이더 트랜지션 */
    #mobile-slider {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    #mobile-slider.view-detail {
      transform: translateX(-50%);
    }

    /* 좌측 전체 병실 모듈 호버 및 선택 상태 */
    .room-module {
      cursor: pointer;
      transition: filter 0.18s ease;
    }
    .room-module:hover, .room-module:active {
      filter: drop-shadow(0 0 6px rgba(92, 136, 252, 0.5));
    }
    .room-module.selected .module-bg {
      stroke: #5c88fc !important;
      stroke-width: 2.2 !important;
      filter: drop-shadow(0 0 6px rgba(92, 136, 252, 0.5));
    }

    /* 문(Door) 기호 인터랙션 스타일 */
    .door-symbol {
      cursor: pointer;
      transition: fill 0.15s ease, stroke 0.15s ease;
    }
    .door-symbol.door-detail:hover, .door-symbol.door-detail:active {
      fill: #193826 !important;
      stroke: #00ff66 !important;
      stroke-width: 1.6 !important;
    }
    .door-symbol.door-overall:hover, .door-symbol.door-overall:active {
      fill: #343c4c !important;
      stroke: #ffffff !important;
      stroke-width: 1.4 !important;
    }
    .door-open {
      fill: #ef4444 !important;
      stroke: #fca5a5 !important;
    }

    /* 탭 메뉴 스타일 */
    .tab-btn {
      border-right: 1px solid #2f3744;
      background-color: #1e1e24;
      color: #8b95a5;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .tab-btn:last-child {
      border-right: none;
    }
    .tab-btn:hover:not(.active), .tab-btn:active:not(.active) {
      background-color: #2a303c;
      color: #eef1f6;
    }
    .tab-btn.active {
      background-color: #202631;
      color: #ffffff;
      border-bottom: 2px solid #5c88fc;
      font-weight: 700;
    }

    /* 모바일 네비게이션 뒤로가기 버튼 */
    .back-btn {
      background: #1e1e24;
      border: 1px solid #3a4250;
      color: #eef1f6;
      transition: all 0.15s ease;
    }
    .back-btn:active {
      background: #2a384c;
      border-color: #5c88fc;
      color: #ffffff;
    }
  </style>
</head>

<body class="h-screen w-screen flex flex-col p-1.5 md:p-2.5 overflow-hidden">
  
  <!-- 상단 공통 컴팩트 헤더 바 -->
  <header class="flex-shrink-0 mb-1.5 flex items-center justify-between bg-[#121212] px-3 py-1.5 rounded border border-[#2f3744] shadow-md">
    <div class="flex items-center gap-2">
      <div class="w-2.5 h-4 bg-[#5c88fc] rounded-xs shadow-xs"></div>
      <h1 class="text-xs sm:text-sm font-semibold tracking-tight text-[#d7dbe2]">
        음압병동 차압 모니터링
      </h1>
      <span class="text-[11px] text-[#8b95a5] hidden sm:inline">
        | 모바일 관제
      </span>
    </div>
    
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5 text-[11px] text-[#7bbf88] font-medium bg-[#171b22] px-2 py-0.5 rounded border border-[#2f3744]">
        <span class="w-1.5 h-1.5 rounded-full bg-[#7bbf88] animate-pulse"></span>
        공조 정상
      </div>
      <span class="text-xs font-mono text-[#aeb8c7]" id="live-clock">--:--:--</span>
    </div>
  </header>

  <!-- 메인 모바일 2단계 슬라이드 컨테이너 -->
  <main class="flex-1 min-h-0 relative overflow-hidden rounded">
    <div id="mobile-slider" class="h-full">
      
      <!-- [화면 1: 첫번째 화면] 전체 모듈러 음압 병동 (Screen 1) -->
      <section id="screen-ward" class="w-1/2 h-full min-h-0 cad-frame rounded p-2 flex flex-col justify-between shadow-lg">
        <div class="flex-shrink-0 flex items-center justify-between pb-1 mb-1 border-b border-[#2f3744]">
          <span class="text-xs font-semibold text-[#d7dbe2] tracking-wide flex items-center gap-1.5">
            <span class="text-[#5c88fc]">●</span> 병동 전체 차압 현황도
          </span>
          <span class="text-[11px] text-[#8b95a5] font-mono">
            상대차압 [Pa]
          </span>
        </div>

        <!-- 전체 병동 CAD 평면도 (SVG) -->
        <div class="flex-1 min-h-0 w-full flex items-center justify-center overflow-hidden bg-[#12151b] rounded border border-[#232935] relative">
          <svg id="ward-svg" viewBox="0 0 760 410" class="w-full h-full max-h-full select-none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="748" height="398" fill="#12151b" stroke="#2f3744" stroke-width="1.4" />

            <!-- 중앙 복도 (너비 110px: x=325 ~ 435) -->
            <g id="corridor-group">
              <line x1="325" y1="6" x2="325" y2="404" stroke="#2f3744" stroke-width="1.2" />
              <line x1="435" y1="6" x2="435" y2="404" stroke="#2f3744" stroke-width="1.2" />
              
              <text x="380" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">복도</text>
              <rect x="360" y="206" width="40" height="17" fill="#1e1e24" stroke="#3a4250" stroke-width="0.9" rx="2" />
              <text x="380" y="218.5" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">0pa</text>
            </g>

            <!-- 8개 모듈 컨테이너 (동적 렌더링) -->
            <g id="modules-container"></g>
          </svg>
        </div>

        <!-- 모바일 편의: 하단 8개 모듈 퀵 셀렉터 칩 -->
        <div class="flex-shrink-0 mt-1.5 grid grid-cols-4 sm:grid-cols-8 gap-1">
          <button onclick="selectModuleAndGo(1)" class="py-1 text-[11px] font-semibold rounded bg-[#1e1e24] hover:bg-[#2a384c] text-[#d7dbe2] border border-[#2f3744]">모듈 1</button>
          <button onclick="selectModuleAndGo(2)" class="py-1 text-[11px] font-semibold rounded bg-[#1e1e24] hover:bg-[#2a384c] text-[#d7dbe2] border border-[#2f3744]">모듈 2</button>
          <button onclick="selectModuleAndGo(3)" class="py-1 text-[11px] font-semibold rounded bg-[#1e1e24] hover:bg-[#2a384c] text-[#d7dbe2] border border-[#2f3744]">모듈 3</button>
          <button onclick="selectModuleAndGo(4)" class="py-1 text-[11px] font-semibold rounded bg-[#1e1e24] hover:bg-[#2a384c] text-[#d7dbe2] border border-[#2f3744]">모듈 4</button>
          <button onclick="selectModuleAndGo(5)" class="py-1 text-[11px] font-semibold rounded bg-[#1e1e24] hover:bg-[#2a384c] text-[#d7dbe2] border border-[#2f3744]">모듈 5</button>
          <button onclick="selectModuleAndGo(6)" class="py-1 text-[11px] font-semibold rounded bg-[#1e1e24] hover:bg-[#2a384c] text-[#d7dbe2] border border-[#2f3744]">모듈 6</button>
          <button onclick="selectModuleAndGo(7)" class="py-1 text-[11px] font-semibold rounded bg-[#1e1e24] hover:bg-[#2a384c] text-[#d7dbe2] border border-[#2f3744]">모듈 7</button>
          <button onclick="selectModuleAndGo(8)" class="py-1 text-[11px] font-semibold rounded bg-[#1e1e24] hover:bg-[#2a384c] text-[#d7dbe2] border border-[#2f3744]">모듈 8</button>
        </div>

        <!-- [하단 안내 문구] 병실을 클릭해서 차압 모니터링을 체험하세요 -->
        <div class="flex-shrink-0 mt-1.5 py-1.5 px-3 bg-[#12151b] border border-[#2f3744] rounded flex items-center justify-center gap-1.5 shadow-sm">
          <span class="text-xs text-[#00ff66] font-medium animate-pulse">👆</span>
          <span class="text-xs text-[#e8ebf0] font-medium tracking-tight">
            병실을 클릭해서 차압 모니터링을 체험하세요
          </span>
        </div>
      </section>

      <!-- [화면 2: 두번째 화면] 개별 병실 상세 및 그래프 (Screen 2) -->
      <section id="screen-detail" class="w-1/2 h-full min-h-0 cad-frame rounded p-2 flex flex-col justify-between shadow-lg">
        
        <!-- 1. 상단 네비게이션 헤더 바 (뒤로가기 버튼 + 모듈 제목) -->
        <div class="flex-shrink-0 border border-[#2f3744] bg-[#12151b] py-1 px-2.5 mb-1.5 flex items-center justify-between rounded-xs">
          <div class="flex items-center gap-2">
            <button onclick="goToWard()" class="back-btn px-2 py-0.5 text-xs font-semibold rounded flex items-center gap-1">
              <span>←</span> 전체 병동
            </button>
            <h2 id="detail-module-title" class="text-xs font-semibold text-[#e8ebf0] tracking-tight">
              병실 모듈 : 1
            </h2>
          </div>
          <span class="text-[10px] text-[#00ff66] font-medium hidden sm:inline">
            도면 문(Door) 터치 시 개폐
          </span>
        </div>

        <!-- 2. 도면 문 클릭 체험 서브 안내 배너 -->
        <div class="flex-shrink-0 mb-1 py-1 px-2 bg-[#171b22] border border-[#2f3744] rounded-xs text-center">
          <span class="text-[11px] text-[#00ff66] font-medium">
            💡 도면의 문(Door)을 클릭하여 차압 모니터링을 체험해보세요
          </span>
        </div>

        <!-- 3. 선택된 모듈 확대 평면도 (비율 40%) -->
        <div class="flex-[4] min-h-0 border border-[#2f3744] bg-[#12151b] p-1.5 mb-1.5 flex items-center justify-center overflow-hidden rounded-xs">
          <svg id="detail-module-svg" viewBox="0 0 360 115" class="w-full h-full max-h-full select-none" xmlns="http://www.w3.org/2000/svg">
            <!-- 선택 모듈 확대 도면 렌더링 -->
          </svg>
        </div>

        <!-- 4. 실별 전환 탭: [ 전실 ] [ 병실 ] [ 화장실 ] -->
        <div class="flex-shrink-0 border border-[#2f3744] grid grid-cols-3 text-center mb-1.5 rounded-xs overflow-hidden">
          <button id="tab-anteroom" class="tab-btn py-1 text-xs active" onclick="switchRoomTab('anteroom')">
            전실
          </button>
          <button id="tab-patientroom" class="tab-btn py-1 text-xs" onclick="switchRoomTab('patientroom')">
            병실
          </button>
          <button id="tab-toilet" class="tab-btn py-1 text-xs" onclick="switchRoomTab('toilet')">
            화장실
          </button>
        </div>

        <!-- 5. 하단 최근 20초 실시간 차압 그래프 (비율 60%) -->
        <div class="flex-[6] min-h-0 border border-[#2f3744] p-2 bg-[#12151b] flex flex-col justify-between rounded-xs">
          <div class="flex-shrink-0 flex items-center justify-between mb-0.5 border-b border-[#232935] pb-1">
            <span class="text-xs font-semibold text-[#d7dbe2] flex items-center gap-1.5">
              <span id="graph-title-room" class="text-[#5c88fc]">전실</span> 차압 모니터링
              <span class="text-[10px] text-[#8b95a5] font-normal">(최근 20초)</span>
            </span>
            <span class="text-xs font-mono font-bold text-[#ffff00] bg-[#1e1e24] px-2 py-0.5 rounded border border-[#2f3744]" id="graph-value-indicator">-2.50 pa</span>
          </div>

          <div class="flex-1 min-h-0 w-full relative">
            <canvas id="pressure-chart" class="w-full h-full block"></canvas>
          </div>
        </div>

      </section>

    </div>
  </main>

  <script>
    const SAMPLING_INTERVAL_MS = 100; // 0.1초 샘플링
    const HISTORY_SECONDS = 20;       // 최근 20초간 기록
    const MAX_POINTS = (HISTORY_SECONDS * 1000) / SAMPLING_INTERVAL_MS; // 200 포인트

    // 각 구역별 설계 기준 차압 (복도 0 Pa 기준)
    const TARGET_PRESSURES = {
      anteroom: -2.5,     // 전실
      patientroom: -5.0,  // 병실
      toilet: -7.5        // 화장실
    };

    // 실 체적(크기)에 따른 HVAC 차압 복원 감쇠율 (체적: 병실 > 전실 > 화장실)
    const DECAY_RATES = {
      toilet: 0.965,      // 화장실: 체적이 가장 작아 가장 빠르게 원상 복구 (기존 유지)
      anteroom: 0.982,    // 전실: 중간 체적으로 완만하게 복구
      patientroom: 0.991  // 병실: 체적이 가장 커서 가장 천천히 복구
    };

    const ROOM_NAMES = {
      anteroom: '전실',
      patientroom: '병실',
      toilet: '화장실'
    };

    // 현재 선택 상태 및 화면 상태
    let selectedModuleId = 1;
    let selectedRoomType = 'anteroom';
    let currentScreen = 'ward'; // 'ward' | 'detail'

    // 8개 병실 모듈 데이터 생성 (1~4: 좌측열, 5~8: 우측열)
    const modulesData = [];
    for (let i = 1; i <= 8; i++) {
      const isRightCol = i > 4;
      modulesData.push({
        id: i,
        name: `병실 모듈 : ${i}`,
        column: isRightCol ? 'right' : 'left',
        row: isRightCol ? (i - 4) : i,
        pressures: {
          anteroom: TARGET_PRESSURES.anteroom,
          patientroom: TARGET_PRESSURES.patientroom,
          toilet: TARGET_PRESSURES.toilet
        },
        doors: {
          anteroom: false,
          patientroom: false,
          toilet: false
        },
        pressureOffsets: {
          anteroom: 0,
          patientroom: 0,
          toilet: 0
        },
        history: {
          anteroom: new Array(MAX_POINTS).fill(TARGET_PRESSURES.anteroom),
          patientroom: new Array(MAX_POINTS).fill(TARGET_PRESSURES.patientroom),
          toilet: new Array(MAX_POINTS).fill(TARGET_PRESSURES.toilet)
        }
      });
    }

    const MODULES_CONTAINER = document.getElementById('modules-container');
    const DETAIL_SVG = document.getElementById('detail-module-svg');
    const CANVAS = document.getElementById('pressure-chart');
    const CTX = CANVAS.getContext('2d');
    const SLIDER = document.getElementById('mobile-slider');

    /**
     * 모바일 화면 전환 함수
     */
    function goToDetail() {
      currentScreen = 'detail';
      SLIDER.classList.add('view-detail');
      setTimeout(() => {
        drawChart();
      }, 330);
    }

    function goToWard() {
      currentScreen = 'ward';
      SLIDER.classList.remove('view-detail');
    }

    /**
     * 모듈 선택 후 상세 화면으로 이동
     */
    function selectModuleAndGo(id) {
      selectModule(id);
      goToDetail();
    }

    /**
     * 모듈 평면도 SVG 내부 콘텐츠 생성 (BIM 다크 테마 적용)
     */
    function generateModuleSVG(mod, w, h, isLeft, isDetail) {
      // 외곽 테두리 및 문 기호 안전 여백
      const padX = isDetail ? 14 : 7;
      const padY = isDetail ? 10 : 5;
      const innerW = w - padX * 2;
      const innerH = h - padY * 2;

      // 실별 너비: 전실 32%, 병실 44%, 화장실 24%
      const toiletW = innerW * 0.24;
      const toiletH = innerH * 0.58;
      const anteW = innerW * 0.32;

      const pAnte = mod.pressures.anteroom.toFixed(2);
      const pPatient = mod.pressures.patientroom.toFixed(2);
      const pToilet = mod.pressures.toilet.toFixed(2);

      const dAnteOpen = mod.doors.anteroom ? 'door-open' : '';
      const dPatientOpen = mod.doors.patientroom ? 'door-open' : '';
      const dToiletOpen = mod.doors.toilet ? 'door-open' : '';

      // 클릭 시 해당 모듈 선택 + 그래프 탭 전환 + 문 개방 실행
      const onDoorAnte = `onclick="event.stopPropagation(); handleDoorClick(${mod.id}, 'anteroom');"`;
      const onDoorPatient = `onclick="event.stopPropagation(); handleDoorClick(${mod.id}, 'patientroom');"`;
      const onDoorToilet = `onclick="event.stopPropagation(); handleDoorClick(${mod.id}, 'toilet');"`;

      // 상세 뷰와 전체 뷰 스케일 설정
      const fontLabel = isDetail ? 12 : 8.5;
      const fontValue = isDetail ? 11 : 8.5;
      const boxW = isDetail ? 54 : 38;
      const boxH = isDetail ? 18 : 13.5;
      const doorThickness = isDetail ? 6.5 : 5.0;
      const wallWidth = isDetail ? 2.6 : 1.8;
      const doorStrokeWidth = isDetail ? 1.4 : 1.1;

      // 색상 토큰 분기: 우측 상세 뷰(형광 초록 문/형광 노랑 수치) vs 좌측 전체 뷰(흰색 문/흰색 수치)
      const wallColor = "#ffffff";
      const moduleBg = "#171b22";
      const doorBg = isDetail ? "#13231a" : "#232935";
      const doorStroke = isDetail ? "#00ff66" : "#ffffff";
      const doorClass = isDetail ? "door-detail" : "door-overall";
      const labelColor = "#ffffff";
      const valBoxBg = "#12151b";
      const valBoxStroke = "#2f3744";
      const valTextColor = isDetail ? "#ffff00" : "#ffffff";

      if (isLeft) {
        /* [좌측 모듈]: 좌측 상단 화장실, 중앙 병실, 우측 전실 (복도 인접) */
        const toiletWallX = padX + toiletW;
        const toiletWallY = padY + toiletH;
        const anteWallX = padX + innerW - anteW;
        const rightWallX = padX + innerW;

        return `
          <!-- 외벽 단일 CAD 벽체선 (흰색) -->
          <rect class="module-bg" x="${padX}" y="${padY}" width="${innerW}" height="${innerH}" fill="${moduleBg}" stroke="${wallColor}" stroke-width="${wallWidth}" />

          <!-- 화장실 구획 벽체 (흰색) -->
          <line x1="${toiletWallX}" y1="${padY}" x2="${toiletWallX}" y2="${toiletWallY}" stroke="${wallColor}" stroke-width="${wallWidth}" />
          <line x1="${padX}" y1="${toiletWallY}" x2="${toiletWallX}" y2="${toiletWallY}" stroke="${wallColor}" stroke-width="${wallWidth}" />

          <!-- 전실 구획 벽체 (흰색) -->
          <line x1="${anteWallX}" y1="${padY}" x2="${anteWallX}" y2="${padY + innerH}" stroke="${wallColor}" stroke-width="${wallWidth}" />

          <!-- 문 기호: 1) 화장실-병실 문 -->
          <rect class="door-symbol ${doorClass} ${dToiletOpen}" x="${toiletWallX - doorThickness / 2}" y="${padY + toiletH * 0.22}" width="${doorThickness}" height="${toiletH * 0.56}" 
                fill="${doorBg}" stroke="${doorStroke}" stroke-width="${doorStrokeWidth}" rx="1" ${onDoorToilet} />

          <!-- 문 기호: 2) 병실-전실 문 -->
          <rect class="door-symbol ${doorClass} ${dPatientOpen}" x="${anteWallX - doorThickness / 2}" y="${padY + innerH * 0.18}" width="${doorThickness}" height="${innerH * 0.36}" 
                fill="${doorBg}" stroke="${doorStroke}" stroke-width="${doorStrokeWidth}" rx="1" ${onDoorPatient} />

          <!-- 문 기호: 3) 전실-복도 문 -->
          <rect class="door-symbol ${doorClass} ${dAnteOpen}" x="${rightWallX - doorThickness / 2}" y="${padY + innerH * 0.18}" width="${doorThickness}" height="${innerH * 0.36}" 
                fill="${doorBg}" stroke="${doorStroke}" stroke-width="${doorStrokeWidth}" rx="1" ${onDoorAnte} />

          <!-- 화장실 라벨 및 차압 박스 -->
          <text x="${padX + toiletW / 2}" y="${padY + toiletH * 0.40}" text-anchor="middle" font-size="${fontLabel}" font-weight="700" fill="${labelColor}">화장실</text>
          <rect x="${padX + toiletW / 2 - boxW / 2}" y="${padY + toiletH * 0.50}" width="${boxW}" height="${boxH}" fill="${valBoxBg}" stroke="${valBoxStroke}" stroke-width="0.8" rx="2" />
          <text id="val-${mod.id}-toilet${isDetail ? '-d' : ''}" x="${padX + toiletW / 2}" y="${padY + toiletH * 0.50 + boxH * 0.72}" text-anchor="middle" font-size="${fontValue}" font-weight="600" fill="${valTextColor}">${pToilet}pa</text>

          <!-- 병실 라벨 및 차압 박스 -->
          <text x="${toiletWallX + (anteWallX - toiletWallX) / 2}" y="${padY + innerH * 0.43}" text-anchor="middle" font-size="${fontLabel + 0.5}" font-weight="700" fill="${labelColor}">병실</text>
          <rect x="${toiletWallX + (anteWallX - toiletWallX) / 2 - boxW / 2}" y="${padY + innerH * 0.54}" width="${boxW}" height="${boxH}" fill="${valBoxBg}" stroke="${valBoxStroke}" stroke-width="0.8" rx="2" />
          <text id="val-${mod.id}-patientroom${isDetail ? '-d' : ''}" x="${toiletWallX + (anteWallX - toiletWallX) / 2}" y="${padY + innerH * 0.54 + boxH * 0.72}" text-anchor="middle" font-size="${fontValue}" font-weight="600" fill="${valTextColor}">${pPatient}pa</text>

          <!-- 전실 라벨 및 차압 박스 -->
          <text x="${anteWallX + anteW / 2}" y="${padY + innerH * 0.43}" text-anchor="middle" font-size="${fontLabel}" font-weight="700" fill="${labelColor}">전실</text>
          <rect x="${anteWallX + anteW / 2 - boxW / 2}" y="${padY + innerH * 0.54}" width="${boxW}" height="${boxH}" fill="${valBoxBg}" stroke="${valBoxStroke}" stroke-width="0.8" rx="2" />
          <text id="val-${mod.id}-anteroom${isDetail ? '-d' : ''}" x="${anteWallX + anteW / 2}" y="${padY + innerH * 0.54 + boxH * 0.72}" text-anchor="middle" font-size="${fontValue}" font-weight="600" fill="${valTextColor}">${pAnte}pa</text>
        `;
      } else {
        /* [우측 모듈 (대칭)]: 좌측 전실 (복도 인접), 중앙 병실, 우측 상단 화장실 */
        const leftWallX = padX;
        const anteWallX = padX + anteW;
        const toiletWallX = padX + innerW - toiletW;
        const toiletWallY = padY + toiletH;

        return `
          <!-- 외벽 단일 CAD 벽체선 (흰색) -->
          <rect class="module-bg" x="${padX}" y="${padY}" width="${innerW}" height="${innerH}" fill="${moduleBg}" stroke="${wallColor}" stroke-width="${wallWidth}" />

          <!-- 전실 구획 벽체 (흰색) -->
          <line x1="${anteWallX}" y1="${padY}" x2="${anteWallX}" y2="${padY + innerH}" stroke="${wallColor}" stroke-width="${wallWidth}" />

          <!-- 화장실 구획 벽체 (흰색) -->
          <line x1="${toiletWallX}" y1="${padY}" x2="${toiletWallX}" y2="${toiletWallY}" stroke="${wallColor}" stroke-width="${wallWidth}" />
          <line x1="${toiletWallX}" y1="${toiletWallY}" x2="${padX + innerW}" y2="${toiletWallY}" stroke="${wallColor}" stroke-width="${wallWidth}" />

          <!-- 문 기호: 1) 복도-전실 문 -->
          <rect class="door-symbol ${doorClass} ${dAnteOpen}" x="${leftWallX - doorThickness / 2}" y="${padY + innerH * 0.18}" width="${doorThickness}" height="${innerH * 0.36}" 
                fill="${doorBg}" stroke="${doorStroke}" stroke-width="${doorStrokeWidth}" rx="1" ${onDoorAnte} />

          <!-- 문 기호: 2) 전실-병실 문 -->
          <rect class="door-symbol ${doorClass} ${dPatientOpen}" x="${anteWallX - doorThickness / 2}" y="${padY + innerH * 0.18}" width="${doorThickness}" height="${innerH * 0.36}" 
                fill="${doorBg}" stroke="${doorStroke}" stroke-width="${doorStrokeWidth}" rx="1" ${onDoorPatient} />

          <!-- 문 기호: 3) 병실-화장실 문 -->
          <rect class="door-symbol ${doorClass} ${dToiletOpen}" x="${toiletWallX - doorThickness / 2}" y="${padY + toiletH * 0.22}" width="${doorThickness}" height="${toiletH * 0.56}" 
                fill="${doorBg}" stroke="${doorStroke}" stroke-width="${doorStrokeWidth}" rx="1" ${onDoorToilet} />

          <!-- 전실 라벨 및 차압 박스 -->
          <text x="${padX + anteW / 2}" y="${padY + innerH * 0.43}" text-anchor="middle" font-size="${fontLabel}" font-weight="700" fill="${labelColor}">전실</text>
          <rect x="${padX + anteW / 2 - boxW / 2}" y="${padY + innerH * 0.54}" width="${boxW}" height="${boxH}" fill="${valBoxBg}" stroke="${valBoxStroke}" stroke-width="0.8" rx="2" />
          <text id="val-${mod.id}-anteroom${isDetail ? '-d' : ''}" x="${padX + anteW / 2}" y="${padY + innerH * 0.54 + boxH * 0.72}" text-anchor="middle" font-size="${fontValue}" font-weight="600" fill="${valTextColor}">${pAnte}pa</text>

          <!-- 병실 라벨 및 차압 박스 -->
          <text x="${anteWallX + (toiletWallX - anteWallX) / 2}" y="${padY + innerH * 0.43}" text-anchor="middle" font-size="${fontLabel + 0.5}" font-weight="700" fill="${labelColor}">병실</text>
          <rect x="${anteWallX + (toiletWallX - anteWallX) / 2 - boxW / 2}" y="${padY + innerH * 0.54}" width="${boxW}" height="${boxH}" fill="${valBoxBg}" stroke="${valBoxStroke}" stroke-width="0.8" rx="2" />
          <text id="val-${mod.id}-patientroom${isDetail ? '-d' : ''}" x="${anteWallX + (toiletWallX - anteWallX) / 2}" y="${padY + innerH * 0.54 + boxH * 0.72}" text-anchor="middle" font-size="${fontValue}" font-weight="600" fill="${valTextColor}">${pPatient}pa</text>

          <!-- 화장실 라벨 및 차압 박스 -->
          <text x="${toiletWallX + toiletW / 2}" y="${padY + toiletH * 0.40}" text-anchor="middle" font-size="${fontLabel}" font-weight="700" fill="${labelColor}">화장실</text>
          <rect x="${toiletWallX + toiletW / 2 - boxW / 2}" y="${padY + toiletH * 0.50}" width="${boxW}" height="${boxH}" fill="${valBoxBg}" stroke="${valBoxStroke}" stroke-width="0.8" rx="2" />
          <text id="val-${mod.id}-toilet${isDetail ? '-d' : ''}" x="${toiletWallX + toiletW / 2}" y="${padY + toiletH * 0.50 + boxH * 0.72}" text-anchor="middle" font-size="${fontValue}" font-weight="600" fill="${valTextColor}">${pToilet}pa</text>
        `;
      }
    }

    /**
     * 좌측 전체 병동 렌더링
     */
    function renderOverallWard() {
      MODULES_CONTAINER.innerHTML = '';

      const modW = 310;
      const modH = 92;
      const leftX = 15;
      const rightX = 435;
      const startY = 12;
      const gapY = 6;

      modulesData.forEach(mod => {
        const isLeft = mod.column === 'left';
        const posX = isLeft ? leftX : rightX;
        const posY = startY + (mod.row - 1) * (modH + gapY);

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('id', `module-group-${mod.id}`);
        g.setAttribute('class', `room-module ${mod.id === selectedModuleId ? 'selected' : ''}`);
        g.setAttribute('transform', `translate(${posX}, ${posY})`);
        
        // 모바일 인터랙션: 모듈 터치/클릭 시 해당 모듈 선택 후 바로 상세 화면으로 이동
        g.onclick = () => selectModuleAndGo(mod.id);

        g.innerHTML = generateModuleSVG(mod, modW, modH, isLeft, false);
        MODULES_CONTAINER.appendChild(g);
      });
    }

    /**
     * 우측 상세 패널의 모듈 확대 도면 렌더링
     */
    function renderDetailView() {
      const mod = modulesData.find(m => m.id === selectedModuleId);
      if (!mod) return;

      document.getElementById('detail-module-title').textContent = `병실 모듈 : ${mod.id}`;
      
      const isLeft = mod.column === 'left';
      DETAIL_SVG.innerHTML = generateModuleSVG(mod, 340, 106, isLeft, true);
    }

    /**
     * 병실 모듈 선택 함수
     */
    function selectModule(id) {
      selectedModuleId = id;

      modulesData.forEach(m => {
        const el = document.getElementById(`module-group-${m.id}`);
        if (el) {
          if (m.id === selectedModuleId) {
            el.classList.add('selected');
          } else {
            el.classList.remove('selected');
          }
        }
      });

      renderDetailView();
      drawChart();
    }

    /**
     * 실별 탭(전실/병실/화장실) 전환 함수
     */
    function switchRoomTab(roomType) {
      selectedRoomType = roomType;

      document.getElementById('tab-anteroom').classList.toggle('active', roomType === 'anteroom');
      document.getElementById('tab-patientroom').classList.toggle('active', roomType === 'patientroom');
      document.getElementById('tab-toilet').classList.toggle('active', roomType === 'toilet');

      document.getElementById('graph-title-room').textContent = ROOM_NAMES[roomType];
      drawChart();
    }

    /**
     * 문(Door) 클릭 시 실행되는 통합 핸들러
     */
    function handleDoorClick(moduleId, roomType) {
      selectModule(moduleId);
      switchRoomTab(roomType);

      // 전체 병동 화면에서 문을 클릭하더라도 상세 화면으로 자동 전환
      if (currentScreen === 'ward') {
        goToDetail();
      }

      const mod = modulesData.find(m => m.id === moduleId);
      if (!mod) return;

      mod.doors[roomType] = true;

      // 차압 스파이크: 0 Pa 방향으로 일시 상승
      const spike = Math.abs(TARGET_PRESSURES[roomType]) * 0.94;
      mod.pressureOffsets[roomType] = spike;

      renderOverallWard();
      renderDetailView();
      drawChart();

      setTimeout(() => {
        mod.doors[roomType] = false;
        renderOverallWard();
        renderDetailView();
      }, 2000);
    }

    /**
     * 센서 미세 진동 및 HVAC 차압 복원 루프 (100ms)
     */
    function updatePhysics() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toTimeString().split(' ')[0];

      modulesData.forEach(mod => {
        ['anteroom', 'patientroom', 'toilet'].forEach(room => {
          const target = TARGET_PRESSURES[room];
          const decay = DECAY_RATES[room];

          // HVAC 음압 복원 지수 감쇠 (실 체적 크기별 차등 적용)
          mod.pressureOffsets[room] *= decay;
          if (Math.abs(mod.pressureOffsets[room]) < 0.005) {
            mod.pressureOffsets[room] = 0;
          }

          // 미세 센서 노이즈
          const noise = (Math.random() - 0.5) * 0.04;
          const currentP = target + mod.pressureOffsets[room] + noise;
          mod.pressures[room] = currentP;

          mod.history[room].push(currentP);
          if (mod.history[room].length > MAX_POINTS) {
            mod.history[room].shift();
          }

          // 좌측 도면 수치 업데이트 (흰색 폰트 유지)
          const valEl = document.getElementById(`val-${mod.id}-${room}`);
          if (valEl) {
            valEl.textContent = `${currentP.toFixed(2)}pa`;
          }

          // 우측 확대 도면 수치 업데이트 (형광 노랑 폰트 유지)
          if (mod.id === selectedModuleId) {
            const detailValEl = document.getElementById(`val-${mod.id}-${room}-d`);
            if (detailValEl) {
              detailValEl.textContent = `${currentP.toFixed(2)}pa`;
            }
          }
        });
      });

      // 그래프 현재값 지시자 갱신
      const curMod = modulesData.find(m => m.id === selectedModuleId);
      if (curMod) {
        const curVal = curMod.pressures[selectedRoomType];
        const indicator = document.getElementById('graph-value-indicator');
        indicator.textContent = `${curVal.toFixed(2)} pa`;
      }

      drawChart();
    }

    /**
     * 최근 20초 차압 실시간 그래프 렌더링 (BIM 다크 테마 Canvas)
     */
    function drawChart() {
      const rect = CANVAS.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      const dpr = window.devicePixelRatio || 1;
      CANVAS.width = rect.width * dpr;
      CANVAS.height = rect.height * dpr;
      CTX.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;

      // 캔버스 배경 클리어 (#12151b)
      CTX.fillStyle = '#12151b';
      CTX.fillRect(0, 0, w, h);

      const marginLeft = 60;
      const marginRight = 15;
      const marginTop = 20;
      const marginBottom = 24;

      const plotW = w - marginLeft - marginRight;
      const plotH = h - marginTop - marginBottom;

      const yMax = 0.5;
      const yMin = -8.2;
      const yRange = yMax - yMin;

      function getY(p) {
        return marginTop + ((yMax - p) / yRange) * plotH;
      }
      function getX(i) {
        return marginLeft + (i / (MAX_POINTS - 1)) * plotW;
      }

      // 수평 기준선 격자 (Grid lines)
      const yTicks = [0, -2.5, -5, -7.5];
      yTicks.forEach(val => {
        const y = getY(val);
        CTX.beginPath();
        CTX.strokeStyle = val === 0 ? '#3a4250' : '#1e2430';
        CTX.lineWidth = 1;
        CTX.moveTo(marginLeft, y);
        CTX.lineTo(marginLeft + plotW, y);
        CTX.stroke();
      });

      /* Y축 레이블 및 눈금 */
      CTX.font = '10px "Inter", "Noto Sans KR", sans-serif';
      CTX.textAlign = 'right';
      CTX.textBaseline = 'middle';
      CTX.fillStyle = '#8b95a5';
      CTX.strokeStyle = '#2f3744';
      CTX.lineWidth = 1;

      // 축 제목: 상대기압 (pa)
      CTX.save();
      CTX.textAlign = 'center';
      CTX.fillStyle = '#aeb8c7';
      CTX.font = '10px "Noto Sans KR", sans-serif';
      CTX.fillText('상대기압 (pa)', marginLeft, marginTop - 10);
      CTX.restore();

      yTicks.forEach(val => {
        const y = getY(val);
        CTX.beginPath();
        CTX.strokeStyle = '#3a4250';
        CTX.moveTo(marginLeft - 5, y);
        CTX.lineTo(marginLeft, y);
        CTX.stroke();

        const label = val === 0 ? '0' : val.toString();
        CTX.fillText(label, marginLeft - 8, y);
      });

      // Y축 수직축선
      CTX.beginPath();
      CTX.strokeStyle = '#2f3744';
      CTX.moveTo(marginLeft, getY(0));
      CTX.lineTo(marginLeft, getY(-7.5) + 6);
      CTX.stroke();

      /* X축 시간선 및 눈금 */
      const xAxisY = marginTop + plotH;
      CTX.beginPath();
      CTX.strokeStyle = '#2f3744';
      CTX.moveTo(marginLeft, xAxisY);
      CTX.lineTo(marginLeft + plotW, xAxisY);
      CTX.stroke();

      for (let i = 1; i <= 4; i++) {
        const tx = marginLeft + (i / 4) * plotW;
        CTX.beginPath();
        CTX.strokeStyle = '#3a4250';
        CTX.moveTo(tx, xAxisY - 3.5);
        CTX.lineTo(tx, xAxisY + 3.5);
        CTX.stroke();
      }

      // X축 중앙 라벨: "시간"
      CTX.textAlign = 'center';
      CTX.textBaseline = 'top';
      CTX.fillStyle = '#8b95a5';
      CTX.fillText('시간', marginLeft + plotW / 2, xAxisY + 6);

      /* 차압 곡선 그리기 (형광 초록색 라인) */
      const mod = modulesData.find(m => m.id === selectedModuleId);
      if (!mod) return;

      const data = mod.history[selectedRoomType];
      if (!data || data.length === 0) return;

      CTX.save();
      CTX.beginPath();
      CTX.strokeStyle = '#00ff66';
      CTX.lineWidth = 1.8;
      CTX.lineJoin = 'round';
      CTX.lineCap = 'round';
      CTX.shadowColor = 'rgba(0, 255, 102, 0.45)';
      CTX.shadowBlur = 4;

      for (let i = 0; i < data.length; i++) {
        const px = getX(i);
        const py = getY(data[i]);
        if (i === 0) {
          CTX.moveTo(px, py);
        } else {
          CTX.lineTo(px, py);
        }
      }
      CTX.stroke();

      // 최신 시점 끝점 원형 마커
      const lastX = getX(data.length - 1);
      const lastY = getY(data[data.length - 1]);
      CTX.shadowBlur = 6;
      CTX.fillStyle = '#66ff99';
      CTX.beginPath();
      CTX.arc(lastX, lastY, 3, 0, Math.PI * 2);
      CTX.fill();

      CTX.restore();
    }

    window.addEventListener('resize', () => {
      drawChart();
    });

    window.onload = function() {
      renderOverallWard();
      renderDetailView();
      drawChart();
      setInterval(updatePhysics, SAMPLING_INTERVAL_MS);
    };
  </script>
</body>
</html>
